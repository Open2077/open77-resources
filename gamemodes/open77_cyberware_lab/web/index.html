<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Open77 Cyberware Lab</title>
  <link rel="stylesheet" href="design-system.css">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <main class="panel" role="dialog" aria-modal="true" aria-label="Cyberware lab" hidden>
    <header class="bar">
      <div class="brand">OPEN<span>//</span>77 <b>CYBERLAB</b></div>
      <div class="bar-actions"><button id="show-dash" type="button" aria-controls="dash">Dash &darr;</button><button id="show-slam" type="button" aria-controls="slam">Ground Slam &darr;</button><button id="show-reflex" type="button" aria-controls="reflex">Overdrive &darr;</button><button id="refresh" type="button">Refresh</button><button id="close" type="button" aria-label="Close cyberware lab">ESC &times;</button></div>
    </header>
    <div class="workspace">
      <aside class="roster">
        <div class="eyebrow">Select player</div>
        <button id="self" type="button" class="self">My cyberware</button>
        <label class="search-label" for="search">Players online <span id="count">0</span></label>
        <input id="search" type="search" placeholder="Search name or ID" autocomplete="off" maxlength="80">
        <div id="players" class="players" aria-label="Online players"></div>
      </aside>
      <section class="content" tabindex="0" aria-label="Scrollable implant and ability controls">
        <div class="target-heading"><div><div class="eyebrow">Implant workshop</div><h1 id="target-name">Loading player</h1><p id="target-detail">Choose an implant and grade below.</p></div><span id="readiness" class="badge">Loading</span></div>
        <div id="implants" class="implants"></div>
        <p class="help">Install a grade to equip it immediately. Arms and legs can be used together.</p>
        <section id="slam" class="slam" aria-label="Ground Slam ability"></section>
        <section id="reflex" class="reflex" aria-label="Overdrive ability"></section>
        <section id="dash" class="dash" aria-label="Dash and Air Dash ability"></section>
      </section>
    </div>
    <footer><div id="status" role="status" aria-live="polite">Choose an implant to get started.</div><span>ESC TO RETURN TO GAME</span></footer>
  </main>
  <script src="app.js"></script>
</body>
</html>
