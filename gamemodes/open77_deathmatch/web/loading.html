<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Open//77 Deathmatch — Loading</title>
<style>
  /* Server-provided loading screen for the Open//77 PvP Deathmatch server.
     Self-contained (no external assets): a strict CSP confines this page to its
     own resource origin. It renders whatever the client forwards over the
     `progress` event and never assumes a state it was not told about. Deliberately
     a hot red arena theme, distinct from the cyan built-in cover, so it is obvious
     this is the SERVER's own screen. */
  :root{
    --red:#ff2d4b; --red-bright:#ff5f78; --ink:#0a0305; --ink2:#170609; --white:#f4e9ec;
    --muted:#c98a95; --dim:#7c4650; --red-rgb:255,45,75;
    --mono:"Rajdhani","Segoe UI",system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:100%;height:100%;overflow:hidden}
  body{
    background:radial-gradient(130% 100% at 50% 12%,#2a060d 0%,#12040a 45%,#060104 100%);
    color:var(--white);font-family:var(--mono);display:grid;place-items:center;position:relative;
  }
  /* animated layers */
  .bg-grid{position:absolute;inset:-2px;opacity:.45;pointer-events:none;
    background:
      linear-gradient(90deg,rgba(var(--red-rgb),.07) 1px,transparent 1px),
      linear-gradient(rgba(var(--red-rgb),.06) 1px,transparent 1px);
    background-size:58px 58px,58px 58px;
    -webkit-mask-image:radial-gradient(circle at 50% 42%,#000 28%,transparent 76%);
            mask-image:radial-gradient(circle at 50% 42%,#000 28%,transparent 76%);
    animation:grid 16s linear infinite}
  @keyframes grid{to{background-position:58px 58px,58px 58px}}
  .bg-glow{position:absolute;width:min(820px,66vw);aspect-ratio:1;border-radius:50%;pointer-events:none;
    background:radial-gradient(circle,rgba(var(--red-rgb),.16),transparent 62%);filter:blur(8px);
    animation:pulse 3.6s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:.5;transform:scale(1)}50%{opacity:.95;transform:scale(1.05)}}
  .bg-scan{position:absolute;inset:0;pointer-events:none;opacity:.5;mix-blend-mode:screen;
    background:linear-gradient(rgba(var(--red-rgb),0) 0,rgba(var(--red-rgb),.07) 50%,rgba(var(--red-rgb),0) 100%);
    background-size:100% 7px;animation:scan 6.5s linear infinite}
  @keyframes scan{from{background-position:0 0}to{background-position:0 100vh}}
  .frame{position:absolute;inset:22px;border:1px solid rgba(var(--red-rgb),.16);
    box-shadow:inset 0 0 80px rgba(0,0,0,.6);pointer-events:none}

  .corner{position:absolute;top:30px;font:700 8px var(--mono);letter-spacing:.24em;text-transform:uppercase;color:var(--dim);display:grid;gap:3px}
  .corner--l{left:34px;justify-items:start}
  .corner--r{right:34px;text-align:right;justify-items:end}
  .tag{color:var(--red-bright);border:1px solid rgba(var(--red-rgb),.45);padding:1px 6px}

  .stage{position:relative;z-index:2;width:min(720px,84vw);display:grid;justify-items:center;gap:clamp(18px,3.2vh,38px);text-align:center}
  .mark{font:900 clamp(46px,8vw,96px)/.85 var(--mono);letter-spacing:.02em;text-transform:uppercase;
    text-shadow:0 0 40px rgba(var(--red-rgb),.4)}
  .mark b{color:var(--red)}
  .mode{color:var(--red-bright);font:800 10px var(--mono);letter-spacing:.5em;text-transform:uppercase}
  .hero{display:grid;gap:10px;justify-items:center}
  .kicker{color:var(--muted);font:800 9px var(--mono);letter-spacing:.3em;text-transform:uppercase}
  .server{font:900 clamp(24px,4.2vw,42px)/1 var(--mono);letter-spacing:.01em;text-transform:uppercase}

  .bar-wrap{width:min(560px,76vw);text-align:left}
  .bar-line{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
  .bar-phase{color:var(--white);font:800 10px var(--mono);letter-spacing:.18em;text-transform:uppercase}
  .bar-pct{color:var(--red-bright);font:800 13px var(--mono)}
  .bar{position:relative;height:5px;background:rgba(var(--red-rgb),.14);overflow:hidden;box-shadow:0 0 0 1px rgba(var(--red-rgb),.14)}
  .bar-fill{width:0;height:100%;background:linear-gradient(90deg,var(--red),var(--red-bright));
    box-shadow:0 0 16px rgba(var(--red-rgb),1);transition:width .28s cubic-bezier(.2,.7,.2,1)}
  .bar.busy .bar-fill{width:34%;animation:sweep 1.1s cubic-bezier(.4,0,.2,1) infinite}
  @keyframes sweep{from{transform:translateX(-110%)}to{transform:translateX(360%)}}
  .bar-detail{min-height:15px;margin-top:9px;color:var(--dim);font:9px var(--mono);letter-spacing:.04em}

  .tip{max-width:600px;color:var(--muted);font:12px/1.5 var(--mono);min-height:20px}
  .tip b{color:var(--red-bright)}

  .foot{position:absolute;bottom:26px;left:0;right:0;display:flex;justify-content:center;gap:24px;
    font:700 8px var(--mono);letter-spacing:.24em;text-transform:uppercase;color:var(--dim)}
  .foot i{width:38px;height:1px;background:rgba(var(--red-rgb),.35);align-self:center}
  @media (prefers-reduced-motion:reduce){*{animation-duration:.001s!important;transition-duration:.001s!important}}
</style>
</head>
<body>
  <div class="bg-grid"></div>
  <div class="bg-glow"></div>
  <div class="bg-scan"></div>
  <div class="frame"></div>

  <div class="corner corner--l"><span class="tag">DM//NET</span><span>ARENA UPLINK</span></div>
  <div class="corner corner--r"><span>FFA · SERVER HOSTED</span><span class="tag">PRE-ALPHA</span></div>

  <div class="stage">
    <div class="mark">OPEN<b>//</b>77</div>
    <div class="mode">Deathmatch</div>

    <div class="hero">
      <div class="kicker">// Entering the arena</div>
      <div class="server" id="server">Open//77 PvP Deathmatch</div>
    </div>

    <div class="bar-wrap">
      <div class="bar-line"><span class="bar-phase" id="phase">Connecting</span><span class="bar-pct" id="pct"></span></div>
      <div class="bar busy" id="bar"><div class="bar-fill" id="fill"></div></div>
      <div class="bar-detail" id="detail"></div>
    </div>

    <div class="tip" id="tip">Aim for the head. Ripperdocs patch bodies, not skulls.</div>
  </div>

  <div class="foot"><span>OPEN//77 DEATHMATCH</span><i></i><span>DO NOT DISTRIBUTE</span></div>

<script>
(function(){
  "use strict";
  var $=function(id){return document.getElementById(id)};
  var phaseEl=$("phase"),pctEl=$("pct"),barEl=$("bar"),fillEl=$("fill"),detailEl=$("detail"),
      serverEl=$("server"),tipEl=$("tip");

  var TIPS=[
    "Aim for the head. Ripperdocs patch bodies, not skulls.",
    "The lobby barrier drops when the round starts. Gear up.",
    "Every hit is arbitrated server-side. No, that wasn't lag.",
    "Reload behind cover. Dogtown remembers the greedy.",
    "Respawn is a privilege, not a right. Don't waste it.",
    "Neon is cover after dark and a target by day."
  ];
  var ti=Math.floor(Math.random()*TIPS.length);
  function tip(){ tipEl.textContent=TIPS[ti%TIPS.length]; ti++; }
  tip(); setInterval(tip,5000);

  var PHASES={connecting:"Connecting",handshake:"Authenticating",authenticating:"Authenticating",
    manifest:"Reading manifest",downloading:"Downloading arena",verifying:"Verifying",
    ready:"Preparing",world:"Loading arena",active:"Loading arena",failed:"Failed"};

  // The only contract with the client: a `progress` event carrying what to show.
  //   { phase, label, fraction (0..1, or <0 = indeterminate), detail, server }
  function onProgress(p){
    if(!p) return;
    if(p.server) serverEl.textContent=p.server;
    var label=p.label||PHASES[p.phase]||String(p.phase||"").replace(/_/g," ")||"Loading";
    phaseEl.textContent=label;
    var f=Number(p.fraction);
    if(!isFinite(f)||f<0){
      barEl.classList.add("busy"); fillEl.style.width="0%"; pctEl.textContent="";
    }else{
      barEl.classList.remove("busy");
      var pct=Math.max(0,Math.min(100,Math.round(f*100)));
      fillEl.style.width=pct+"%"; pctEl.textContent=pct+"%";
    }
    if(typeof p.detail==="string") detailEl.textContent=p.detail;
  }

  if(window.Open77){
    try{ Open77.on("progress",onProgress); }catch(e){}
    try{ Open77.on("server",function(v){ if(v&&v.name) serverEl.textContent=v.name; }); }catch(e){}
    try{ Open77.ready(); }catch(e){}
  }
})();
</script>
</body>
</html>
