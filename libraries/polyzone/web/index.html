<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PolyZone · Open77</title><link rel="stylesheet" href="editor.css"></head>
<body><main id="editor" hidden>
<header><div><small>OPEN//77 · DEVELOPER TOOLS</small><h1>POLYZONE<span>.</span></h1></div><button id="close" title="Release focus (F9 / Escape)">×</button></header>
<p class="hint">F9 releases the cursor so you can walk. F10 adds a vertex at your feet.</p>
<section id="new"><fieldset id="kind" class="zone-types"><legend>Zone type</legend><label><input type="radio" name="kind" value="poly" checked> Polygon</label><label><input type="radio" name="kind" value="box"> Oriented box</label><label><input type="radio" name="kind" value="circle"> Circle / sphere</label></fieldset><button id="create">Create zone</button></section>
<section id="properties" hidden><label>Name<input id="name" maxlength="96"></label><div class="grid">
<label data-for="box">Length<input id="length" type="number" min="0.01" step="0.1"></label>
<label data-for="box">Width<input id="width" type="number" min="0.01" step="0.1"></label>
<label data-for="box">Heading °<input id="heading" type="number" step="1"></label>
<label data-for="circle">Radius<input id="radius" type="number" min="0.01" step="0.1"></label>
<label data-for="height">Minimum Z<input id="minZ" type="number" step="0.1" placeholder="Unbounded"></label>
<label data-for="height">Maximum Z<input id="maxZ" type="number" step="0.1" placeholder="Unbounded"></label></div>
<label data-for="circle" class="check"><input id="useZ" type="checkbox"> Use Z (sphere)</label>
<p id="count"></p><div class="actions"><button id="here">Move to player</button><button id="add">Add vertex</button><button id="undo">Undo</button></div>
<div class="actions"><button id="finish" class="primary">Finish & save</button><button id="cancel">Cancel</button></div></section>
<section><div class="source-title"><h2>Lua source</h2><button id="copy">Copy</button></div><textarea id="source" readonly spellcheck="false" aria-label="Generated Lua source"></textarea></section>
<p id="notice" role="status">Ready. Only your local debug zones are drawn.</p>
</main><script src="editor.js"></script></body></html>
