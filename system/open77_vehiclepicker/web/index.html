<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Open77 — Vehicle picker</title>
  <link rel="stylesheet" href="open77-ui.css">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div class="wrap">
    <div class="scrim" id="scrim"></div>

    <section class="panel" role="dialog" aria-modal="true" aria-labelledby="title">
      <header class="head">
        <div>
          <p class="op77-eyebrow" id="eyebrow">LOADOUT</p>
          <h1 id="title">Select vehicle</h1>
          <p class="sub" id="subtitle"></p>
        </div>
        <div class="head-right">
          <div class="deadline" id="deadline" aria-live="off"></div>
          <button class="close" id="close" aria-label="Close">ESC</button>
        </div>
      </header>

      <div class="lock" id="lock">
        <span class="op77-eyebrow">LOCKED</span>
        <span id="lock-text">The match has started. Your pick is saved for the next one.</span>
      </div>

      <div class="grid" id="grid"></div>

      <footer class="foot">
        <div>
          <span class="keys"><span>←</span><span>→</span>MOVE</span>
          <span class="keys"><span>ENTER</span>PICK</span>
          <span class="keys"><span>ESC</span>CLOSE</span>
        </div>
        <div class="status" id="status"></div>
      </footer>
    </section>
  </div>

  <script src="app.js"></script>
</body>
</html>
